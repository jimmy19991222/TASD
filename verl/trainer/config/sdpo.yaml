defaults:
  - ppo_trainer
  - user
  - _self_

# MAX_PROMPT_LENGTH=2048
# MAX_RESPONSE_LENGTH=8192
# MAX_FEEDBACK_LENGTH=8192
# TEMPLATE_LENGTH=512  # heuristic upper bound, not enforced
# MAX_MODEL_LEN=$((TEMPLATE_LENGTH + MAX_PROMPT_LENGTH + MAX_FEEDBACK_LENGTH + MAX_RESPONSE_LENGTH))
max_model_len: 18944

seed: 42

actor_rollout_ref:
  actor:
    ppo_mini_batch_size: 32 # TODO: make slightly off-policy in the future; use same as baseline; perhaps make 1 again for fastest convergence
    policy_loss:
      loss_mode: sdpo
    self_distillation:
      max_reprompt_len: 10240
      is_clip: 2.0
      # Geodesic SDPO: Fisher 度量加权（流形约束）
      # 理论：在概率流形上做 Natural Gradient 更新，内生保护熵结构
      use_geodesic: False  # 默认关闭，消融实验时开启
      geodesic_trust_region: 5.0  # Trust Region 阈值（几何 Huber 裁剪，比 clamp 更平滑）
      geodesic_beta_scale: 0.5    # β 缩放因子（补偿 manifold weight 的梯度放大效应）
    optim:
      lr: 1e-5
  rollout:
    n: 8
    calculate_log_probs: True

algorithm:
  adv_estimator: grpo # disables critic
  norm_adv_by_std_in_grpo: False
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0

  # Self-Teacher Advantage configuration (for loss_mode=self_teacher)
  use_vce: False  # Whether to use V_CE baseline
  use_log_pi_s: False  # Whether to use log pi_s
  clip_value: 3.0  # Advantage clip threshold
  adv_std_floor: 0.0  # Standard deviation floor

data:
  train_batch_size: 32

trainer:
  val_before_train: False
